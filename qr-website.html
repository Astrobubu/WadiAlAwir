<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Stock QR Code | Wadi Al Awir</title>
  <meta name="theme-color" content="#070B14">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Bebas+Neue&family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #070B14;
      --bg-card: #0F1525;
      --accent: #D4A853;
      --accent-light: #E8C573;
      --text-primary: #EDE9E0;
      --text-secondary: #A8ADBC;
      --paper: #FFFDF7;
      --ink: #111622;
      --font-ar-display: 'Aref Ruqaa', serif;
      --font-ar-body: 'Cairo', sans-serif;
      --font-en-display: 'Bebas Neue', sans-serif;
      --font-en-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top, rgba(212, 168, 83, 0.18), transparent 34%),
        linear-gradient(145deg, #070B14 0%, #111827 48%, #070B14 100%);
      color: var(--text-primary);
      font-family: var(--font-en-body);
      line-height: 1.45;
    }

    .qr-sheet {
      width: min(100%, 720px);
      min-height: 940px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 28px;
      padding: 48px;
      border: 1px solid rgba(212, 168, 83, 0.36);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01)),
        var(--bg-card);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .brand {
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .brand__logo {
      width: 118px;
      height: 118px;
      object-fit: contain;
    }

    .brand__ar {
      font-family: var(--font-ar-display);
      font-size: 2.7rem;
      line-height: 1;
      color: var(--accent);
    }

    .brand__en {
      font-family: var(--font-en-display);
      font-size: 1.5rem;
      letter-spacing: 0.18em;
      color: var(--text-primary);
    }

    .headline {
      display: grid;
      align-content: center;
      gap: 18px;
    }

    .eyebrow {
      font-family: var(--font-en-display);
      letter-spacing: 0.2em;
      color: var(--accent-light);
      font-size: 1.35rem;
    }

    h1 {
      font-family: var(--font-en-display);
      font-size: clamp(3.8rem, 10vw, 6.4rem);
      line-height: 0.92;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .headline__ar {
      font-family: var(--font-ar-body);
      font-size: clamp(1.7rem, 4.4vw, 2.4rem);
      font-weight: 700;
      color: var(--accent);
    }

    .copy {
      max-width: 520px;
      margin: 0 auto;
      color: var(--text-secondary);
      font-size: 1.18rem;
    }

    .qr-card {
      width: min(100%, 430px);
      margin: 8px auto 0;
      padding: 24px;
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
    }

    .qr-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
    }

    .url {
      margin-top: 18px;
      color: #334155;
      font-size: 1.22rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .footer-note {
      display: grid;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .footer-note strong {
      color: var(--accent);
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
      }

      .qr-sheet {
        min-height: auto;
        padding: 28px 18px;
      }

      .brand__logo {
        width: 92px;
        height: 92px;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }

      body {
        min-height: auto;
        padding: 0;
        background: #fff;
        color: var(--ink);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .qr-sheet {
        width: 100%;
        height: 250mm;
        min-height: 0;
        gap: 4mm;
        padding: 8mm;
        border: 2px solid #D4A853;
        box-shadow: none;
        page-break-inside: avoid;
      }

      .brand {
        gap: 4mm;
      }

      .brand__logo {
        width: 18mm;
        height: 18mm;
      }

      .brand__ar {
        font-size: 22pt;
      }

      .brand__en {
        font-size: 12pt;
      }

      .headline {
        gap: 4mm;
      }

      .eyebrow {
        font-size: 11pt;
      }

      h1 {
        font-size: 38pt;
      }

      .headline__ar {
        font-size: 20pt;
      }

      .copy {
        font-size: 10.5pt;
      }

      .qr-card {
        width: 96mm;
        padding: 5mm;
      }

      .url {
        margin-top: 4mm;
        font-size: 10pt;
      }

      .footer-note {
        gap: 1mm;
        font-size: 9pt;
      }
    }
  </style>
</head>
<body>
  <main class="qr-sheet" aria-label="Website QR code">
    <header class="brand">
      <img class="brand__logo" src="wadi-al-awir-logo.png" alt="Wadi Al Awir logo">
      <div>
        <div class="brand__ar" lang="ar" dir="rtl">وادي العوير</div>
        <div class="brand__en">WADI AL AWIR</div>
      </div>
    </header>

    <section class="headline">
      <p class="eyebrow">SHOP ONLINE</p>
      <h1>Check Out Our Stock</h1>
      <p class="headline__ar" lang="ar" dir="rtl">امسح الرمز لتصفح المنتجات المتوفرة</p>
      <p class="copy">Scan to browse available Jetour accessories, photos, prices, and WhatsApp ordering from your phone.</p>
      <div class="qr-card">
        <img src="assets/qr/website-qr.svg" alt="QR code to visit wadialawir.com">
        <p class="url">wadialawir.com</p>
      </div>
    </section>

    <footer class="footer-note">
      <p><strong>Scan with your phone camera</strong></p>
      <p lang="ar" dir="rtl">امسح الرمز بكاميرا الهاتف</p>
    </footer>
  </main>
</body>
</html>
